  teleport-info: "<gray>Choose how you want to teleport."
  tpa-menu-button: "<aqua>Teleport to a player <gray>(TPA)"
  tpahere-menu-button: "<aqua>Bring a player to me <gray>(TPA Here)"
  favorites-button: "<gold>★ Favorites"
  fav-title: "<aqua>DiamondCraft <gray>| <gold>Favorites"
  fav-info: "<gray>Click a friend to teleport faster."
