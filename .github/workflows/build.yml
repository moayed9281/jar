name: Build DiamondCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync root Java uploads into Maven sources
        if: github.ref_type == 'branch' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_dir = Path("src/main/java/com/smpcore")
          candidates = sorted(Path(".").glob("*.java"))
          plan = []
          conflicts = []

          for root_file in candidates:
              content = root_file.read_bytes()
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  conflicts.append(f"{root_file}: file is not UTF-8")
                  continue
              if "package com.smpcore;" not in text:
                  conflicts.append(f"{root_file}: expected package com.smpcore;")
                  continue

              target = source_dir / root_file.name
              if target.exists() and target.read_bytes() != content:
                  conflicts.append(f"{root_file} differs from {target}")
              else:
                  plan.append((root_file, target, content))

          if conflicts:
              raise SystemExit(
                  "Root Java sync stopped to avoid overwriting different Maven code:\n"
                  + "\n".join(conflicts)
                  + "\nResolve these files manually, then push again."
              )

          for root_file, target, content in plan:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              root_file.unlink()
              print(f"Moved {root_file} to {target}")
          PY

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- '*.java'
            git commit -m "Sync uploaded Java sources into Maven layout"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify JAR classes and resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jar = Path("target/DiamondCraft.jar")
          if not jar.is_file():
              raise SystemExit("ERROR: target/DiamondCraft.jar was not produced.")

          with ZipFile(jar) as archive:
              entries = set(archive.namelist())

          missing = []
          java_files = list(Path("src/main/java").rglob("*.java"))
          for source in java_files:
              expected = source.relative_to("src/main/java").with_suffix(".class").as_posix()
              if expected not in entries:
                  missing.append(expected)

          resource_files = [p for p in Path("src/main/resources").rglob("*") if p.is_file()]
          for resource in resource_files:
              expected = resource.relative_to("src/main/resources").as_posix()
              if expected not in entries:
                  missing.append(expected)

          if missing:
              raise SystemExit("ERROR: Missing from JAR: " + ", ".join(missing))

          print(f"Verified {len(java_files)} source classes and {len(resource_files)} resources in {jar}.")
          PY

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiamondCraft-jar
          path: target/DiamondCraft.jar
          if-no-files-found: error
