name: Build DiamondCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync changed root uploads into their source locations
        if: github.ref_type == 'branch' && github.actor != 'github-actions[bot]' && github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          changed = set()
          for commit in event.get("commits", []):
              changed.update(commit.get("added", []))
              changed.update(commit.get("modified", []))

          routes = {}
          for path in changed:
              if "/" in path:
                  continue
              if path.endswith(".java"):
                  routes[path] = f"src/main/java/com/smpcore/{path}"
              elif path in {"config.yml", "paper-plugin.yml"}:
                  routes[path] = f"src/main/resources/{path}"
              elif path in {"DISCORD-SETUP.md", "NETWORK-SETUP.md"}:
                  routes[path] = f"docs/{path}"

          moves = []
          conflicts = []
          for source_name, target_name in sorted(routes.items()):
              source = Path(source_name)
              target = Path(target_name)
              if not source.is_file():
                  continue
              content = source.read_bytes()
              if source.suffix == ".java":
                  try:
                      text = content.decode("utf-8")
                  except UnicodeDecodeError:
                      conflicts.append(f"{source}: file is not UTF-8")
                      continue
                  if "package com.smpcore;" not in text:
                      conflicts.append(f"{source}: expected package com.smpcore;")
                      continue
              if target_name in changed and target.exists() and target.read_bytes() != content:
                  conflicts.append(f"{source} and {target} both changed differently in this push")
                  continue
              moves.append((source, target, content))

          if conflicts:
              raise SystemExit(
                  "Upload sync stopped to avoid resolving two edited copies automatically:\n"
                  + "\n".join(conflicts)
                  + "\nKeep one authoritative copy and push again."
              )

          for source, target, content in moves:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              source.unlink()
              print(f"Placed {source} at {target}")

          # build.yml at the repository root is not an active Actions workflow.
          # The enhanced workflow at .github/workflows/build.yml already includes
          # its Maven build and artifact upload steps.
          legacy_build = Path("build.yml")
          if "build.yml" in changed and legacy_build.is_file():
              legacy_build.unlink()
              print("Removed duplicate root build.yml; active workflow is .github/workflows/build.yml")
          PY

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Place uploaded files in project directories"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify JAR classes and resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jar = Path("target/DiamondCraft.jar")
          if not jar.is_file():
              raise SystemExit("ERROR: target/DiamondCraft.jar was not produced.")

          with ZipFile(jar) as archive:
              entries = set(archive.namelist())

          missing = []
          java_files = list(Path("src/main/java").rglob("*.java"))
          for source in java_files:
              expected = source.relative_to("src/main/java").with_suffix(".class").as_posix()
              if expected not in entries:
                  missing.append(expected)

          resource_files = [p for p in Path("src/main/resources").rglob("*") if p.is_file()]
          for resource in resource_files:
              expected = resource.relative_to("src/main/resources").as_posix()
              if expected not in entries:
                  missing.append(expected)

          if missing:
              raise SystemExit("ERROR: Missing from JAR: " + ", ".join(missing))

          print(f"Verified {len(java_files)} source classes and {len(resource_files)} resources in {jar}.")
          PY

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiamondCraft-jar
          path: target/DiamondCraft.jar
          if-no-files-found: error
