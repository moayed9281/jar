name: Build DiamondCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply Gson compatibility fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_dir = Path("src/main/java")
          if not source_dir.exists():
              raise SystemExit("ERROR: src/main/java was not found.")

          parser_fixes = 0
          array_fixes = 0

          for path in source_dir.rglob("*.java"):
              original = path.read_text(encoding="utf-8")
              updated = original

              # Gson versions with the older API use JsonParser().parse(...).
              updated, count = re.subn(
                  r'com\.google\.gson\.JsonParser\.parseString\(',
                  'new com.google.gson.JsonParser().parse(',
                  updated
              )
              parser_fixes += count

              updated, count = re.subn(
                  r'(?<![\w.])JsonParser\.parseString\(',
                  'new JsonParser().parse(',
                  updated
              )
              parser_fixes += count

              # These two calls add strings to Gson JsonArray instances.
              if path.name == "FavoritesManager.java":
                  updated, count = re.subn(
                      r'\ba\.add\(u\.toString\(\)\);',
                      'a.add(new com.google.gson.JsonPrimitive(u.toString()));',
                      updated
                  )
                  array_fixes += count

              if path.name == "Net.java":
                  updated, count = re.subn(
                      r'\ba\.add\(s\);',
                      'a.add(new com.google.gson.JsonPrimitive(s));',
                      updated
                  )
                  array_fixes += count

              if updated != original:
                  path.write_text(updated, encoding="utf-8")

          remaining = []
          for path in source_dir.rglob("*.java"):
              text = path.read_text(encoding="utf-8")
              if "JsonParser.parseString(" in text:
                  remaining.append(str(path))

          print(f"Updated JsonParser calls: {parser_fixes}")
          print(f"Updated JsonArray string additions: {array_fixes}")

          if remaining:
              raise SystemExit(
                  "ERROR: Unsupported parseString calls remain in: "
                  + ", ".join(remaining)
              )
          PY

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiamondCraft-jar
          path: target/*.jar
          if-no-files-found: error
