name: Build DiamondCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify JAR classes and resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jar = Path("target/DiamondCraft.jar")
          if not jar.is_file():
              raise SystemExit("ERROR: target/DiamondCraft.jar was not produced.")

          with ZipFile(jar) as archive:
              entries = set(archive.namelist())

          missing = []
          java_files = list(Path("src/main/java").rglob("*.java"))
          for source in java_files:
              expected = source.relative_to("src/main/java").with_suffix(".class").as_posix()
              if expected not in entries:
                  missing.append(expected)

          resource_files = [p for p in Path("src/main/resources").rglob("*") if p.is_file()]
          for resource in resource_files:
              expected = resource.relative_to("src/main/resources").as_posix()
              if expected not in entries:
                  missing.append(expected)

          if missing:
              raise SystemExit("ERROR: Missing from JAR: " + ", ".join(missing))

          print(f"Verified {len(java_files)} source classes and {len(resource_files)} resources in {jar}.")
          PY

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DiamondCraft-jar
          path: target/DiamondCraft.jar
          if-no-files-found: error
