# ============ DiamondCraft config ============
# Text uses MiniMessage: <red>, <gold>, <bold>, <gradient:red:blue> ...
# Reload with /smpcore reload.  (Esc menu + menu style changes need a server RESTART.)

prefix: "<dark_gray>[<aqua>DiamondCraft<dark_gray>] <gray>"

# ---------------------------------------------------------------- HOMES
homes:
  # Homes every normal player gets for free
  default-limit: 1
  # Home limits per LuckPerms GROUP NAME. A player gets the HIGHEST one they match.
  # Rename the groups to your LuckPerms group names and change the numbers.
  # Add or remove lines as you like (5 VIP ranks are set up as an example).
  group-limits:
    vip: 3
    vip2: 5
    vip3: 8
    vip4: 12
    vip5: 20
  # You can ALSO use permissions: smpcore.homes.<number> (e.g. smpcore.homes.10)
  # and smpcore.homes.unlimited
  max-name-length: 16
  open-menu-on-home: true

# ---------------------------------------------------------------- TELEPORT / TPA
teleport:
  delay: 3
  cancel-on-move: true

tpa:
  tpa-enabled: true                  # false = /tpa is disabled for everyone
  tpahere-enabled: true              # false = /tpahere is disabled for everyone
  tpa-min-playtime-minutes: 0        # playtime needed before /tpa (0 = no limit)
  tpahere-min-playtime-minutes: 0    # playtime needed before /tpahere (0 = no limit)
  expire: 60
  cooldown: 10
  incoming-menu: true
  # permission smpcore.bypass.playtime skips the playtime rule

# ---------------------------------------------------------------- NETWORK (Velocity, several servers)
# Shares money, homes, bans/timeouts/history, favorites, settings, Discord links and TPA
# between all your servers through ONE MySQL/MariaDB database. Needs a restart to change.
# Full guide: docs/NETWORK-SETUP.md
network:
  enabled: false
  server-name: "survival"    # EXACT name of THIS server in velocity.toml
  sync-seconds: 3            # how often servers check the database for changes
  database:
    host: "127.0.0.1"
    port: 3306
    name: "diamondcraft"
    user: "diamondcraft"
    password: "change-me"
    pool-size: 6

# ---------------------------------------------------------------- RTP (random teleport)
rtp:
  enabled: true              # false = CLOSES /rtp AND /rtpq completely (and hides their buttons)
  cooldown: 30               # seconds between random teleports (0 = none)
  max-attempts: 40           # tries to find a safe spot before giving up
  max-concurrent: 4          # how many players can search at the same time (protects the server)
  # Each world below can be closed on its own: set enabled: false
  # (e.g. enabled: false on "end" closes RTP to the End, on "nether" closes the Nether).
  # "world" is the real world folder name of your server.
  # Distances are measured from the center. A random spot between min and max is used.
  worlds:
    overworld:
      enabled: true
      world: "world"
      name: "Overworld"
      color: "<green>"
      icon: GRASS_BLOCK
      center-x: 0
      center-z: 0
      min-radius: 500
      max-radius: 5000
      price: 0               # needs economy.enabled; 0 = free
    nether:
      enabled: true
      world: "world_nether"
      name: "Nether"
      color: "<red>"
      icon: NETHERRACK
      center-x: 0
      center-z: 0
      min-radius: 100
      max-radius: 1500
      price: 0
    end:
      enabled: true
      world: "world_the_end"
      name: "The End"
      color: "<light_purple>"
      icon: END_STONE
      center-x: 0
      center-z: 0
      min-radius: 1000       # outer End islands start around 1000 blocks out
      max-radius: 3000
      price: 0
  # RTP Queue (/rtpq): players join the queue; when enough are waiting, they all
  # get teleported to the SAME random spot a few seconds later.
  queue:
    enabled: true            # false = closes only /rtpq
    world: overworld         # which world above the queue uses
    players: 2               # players needed to start
    match-delay: 3           # seconds after enough players joined

# ---------------------------------------------------------------- ECONOMY
economy:
  enabled: true                      # false = economy, /pay, /balance and Vault hook are off
  starting-balance: 100
  symbol: "$"
  currency-single: "dollar"
  currency-plural: "dollars"
  min-pay: 1
  max-balance: 1000000000000   # nobody can ever hold more than this
  log-pay-over: 100000         # payments at or above this are written to economy-log.txt
  pay-presets: [100, 1000, 10000, 100000]   # amounts shown in the Pay menu
  # Needs the Vault plugin so EconomyShopGUI can use this economy.
  # Do not run another economy plugin (EssentialsX etc.) at the same time.

favorites:
  max: 20                            # favourite friends per player

# ---------------------------------------------------------------- SETTINGS MENU
settings:
  night-vision: true                 # show the Night Vision toggle

