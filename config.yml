# ---------------------------------------------------------------- ESC MENU
# Button in the Esc (pause) menu, Java 1.21.6+. Needs a server RESTART to change.
# Every button runs a command for the player (no leading slash).
# requires: economy  ->  button is hidden when economy.enabled is false.
# /menu opens the same buttons for Bedrock players or NPCs.
esc-menu:
  enabled: true
  title: "<aqua><bold>DiamondCraft"
  body: "<gray>Homes, teleport, shop and more"
  columns: 2
  button-width: 150
  buttons:
    - {label: "Homes", command: "homes"}
    - {label: "RTP", command: "rtp", requires: rtp}
    # Auction runs another plugin's command. Change "ah" to your auction plugin's command
    # or delete this line if you have no auction plugin.
    - {label: "Auction", command: "ah"}
    - {label: "RTP Queue", command: "rtpq", requires: rtpq}
    # Shop and Sell use EconomyShopGUI (/shop and /sellgui). Premium: same commands.
    - {label: "Shop", command: "shop", requires: economy}
    - {label: "Friends", command: "tpfav"}
    - {label: "Sell", command: "sellgui", requires: economy}
    - {label: "Pay", command: "pay", requires: economy}
    - {label: "Teleport", command: "tpmenu"}
    - {label: "Status", command: "status"}
    - {label: "Balance", command: "balance", requires: economy}
    - {label: "Settings", command: "settings"}

# ---------------------------------------------------------------- DISCORD LINK
# A Discord bot that runs INSIDE this plugin. Players type /link in the game to get a code,
# then run /link <code> in Discord. See docs/DISCORD-SETUP.md for the 5 minute setup.
discord:
  enabled: false
  bot-token: "PUT-YOUR-BOT-TOKEN-HERE"   # keep this private! Never share it.
  guild-id: ""               # your Discord SERVER ID (makes the slash commands appear instantly)
  linked-role-id: ""         # optional: role given to linked players (bot needs Manage Roles)
  code-minutes: 10           # how long a /link code works
  network-link: true         # network mode: /link also works on servers where the bot is NOT running
  # ---- LOG CHANNELS: the bot posts bans, timeouts, kicks, unbans, /eco actions and links here.
  # How to get a channel ID: Discord Settings > Advanced > Developer Mode ON, then right-click the
  # channel > Copy Channel ID. The bot needs View Channel, Send Messages and Embed Links there.
  # Check it with /smpcore testlog (after /smpcore reload).
  logs:
    channel-id: ""               # default channel for ALL logs (leave empty = no logs)
    punishments-channel-id: ""   # optional: bans / timeouts / kicks / unbans go here instead
    economy-channel-id: ""       # optional: /eco and big payments go here instead
    links-channel-id: ""         # optional: Discord link / unlink events go here instead
  link-reward: 0             # money for linking the first time (needs economy), 0 = none
  # Console commands run ONCE per account when linking ({player} and {uuid} are filled in).
  # If the player is offline they run the next time they join. Examples:
  #   link-commands: ["give {player} diamond 5", "lp user {player} permission set cool.perk true"]
  link-commands: []

# ---------------------------------------------------------------- STAFF MENU (/punish)
# Only players with the permission smpcore.staff (OP by default) can open it.
# Every ban, timeout and kick needs a reason and gets an ID (B-12, T-5, K-30).
# Players with smpcore.punish.exempt cannot be punished by staff.
staff:
  min-reason-length: 3
  # Names or UUIDs that staff can NEVER punish through the plugin (add your owner/admins here).
  # OPs are also protected from non-OP staff, and players with smpcore.punish.exempt too.
  protected: []
  max-reason-length: 200
  list-size: 100
  ban-durations: ["1d", "7d", "30d", "perm"]
  timeout-durations: ["1h", "6h", "1d", "3d", "7d"]
  reasons:
    - "Hacking / cheating"
    - "Griefing"
    - "Toxic behaviour"
    - "Spamming"
    - "Advertising"
    - "Exploiting a bug"
    - "Ban evasion"

# ---------------------------------------------------------------- PUNISHMENTS
punishments:
  default-ban-reason: "No reason given"
  default-kick-reason: "No reason given"
  default-timeout-reason: "No reason given"
  permanent-text: "Permanent"
  date-format: "yyyy-MM-dd HH:mm z"
  broadcast: true
  # Cracked (offline-mode) servers: "Steve" and "sTeve" are different accounts, so a banned player can
  # simply change the spelling. true = bans and timeouts also match the NAME in any upper/lower case.
  # (On a premium server you can set this to false.)
  match-names: true

screens:
  ban:
    - "<red><bold>You are banned"
    - ""
    - "<gray>Reason: <white>{reason}"
    - "<gray>Duration: <white>{duration}"
    - "<gray>Expires: <white>{expires}"
    - "<gray>By: <white>{staff}"
    - "<gray>Ban ID: <white>{id}"
  kick:
    - "<red><bold>You were kicked"
    - ""
    - "<gray>Reason: <white>{reason}"
    - "<gray>Kick ID: <white>{id}"
  timeout:
    - "<gold><bold>You are in timeout"
    - ""
    - "<gray>Reason: <white>{reason}"
    - "<gray>You can rejoin in: <white>{duration}"
    - "<gray>Expires: <white>{expires}"
    - "<gray>Timeout ID: <white>{id}"

